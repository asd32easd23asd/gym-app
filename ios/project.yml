name: GymPlanner
options:
  bundleIdPrefix: com.s.gymplanner
  deploymentTarget:
    iOS: "15.4"
targets:
  GymPlanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: WebApp
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Gym Planner
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles: [AppIcon60x60]
        CFBundleShortVersionString: "2.0.1"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
        NSCameraUsageDescription: Maak een voortgangsfoto die lokaal op je iPhone wordt bewaard.
        NSPhotoLibraryUsageDescription: Kies een voortgangsfoto voor je lokale logboek.
        NSPhotoLibraryAddUsageDescription: Bewaar een door jou gekozen foto in je fotobibliotheek.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s.gymplanner.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        SWIFT_VERSION: "5.0"
