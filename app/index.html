    var pd = planDay(pl, wd);
    pd.workoutName = String(src.workout || src.workoutName || "");
    pd.exercises = (Array.isArray(src.exercises) ? src.exercises : []).map(function (e) {
      return { name: String(e.name || ""), sets: Math.max(1, parseInt(e.sets, 10) || 3),
               reps: Math.max(1, parseInt(e.reps, 10) || 10), kg: parseFloat(e.kg) || 0, note: "" };
    }).filter(function (e) { return e.name; });
    pd.take = (Array.isArray(src.take) ? src.take : []).map(function (t) {
      var nm = keyOf(t && t.name);
      var p = state.stack.filter(function (x) { return keyOf(x.nm) === nm; })[0];
      return p ? { id: uid(), itemId: p.id, moment: MOMENTS.indexOf(t.moment) >= 0 ? t.moment : "Morning", time: String(t.time || "") } : null;
    }).filter(Boolean);
    pd.notes = String(src.note || src.notes || "");
    pd.reminders = (Array.isArray(src.reminders) ? src.reminders : []).map(function (r) {
      return { text: String(r.text || ""), time: String(r.time || "") };
    }).filter(function (r) { return r.text; });
  }
  state.plans.push(pl);
  editPlanId = pl.id; editWd = null;
  save();
  return null;
}

function activatePlan(id) {
  var pl = plan(id);
  if (!pl) return;
  var old = activePlan();
  if (old && old.id !== id) old.status = "archived";
  pl.status = "active";
  state.activePlanId = id;
  if (!state.planLog.length || state.planLog[state.planLog.length - 1].planId !== id) {
    state.planLog.push({ planId: id, from: today() });
  }
  bumpSched();
  editPlanId = null; editWd = null;
  save();
}

/* ============================================================
   notifications — unchanged bridge, wider window, also on hide
   ============================================================ */
function nativeBridge() {
  try { return (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.notify) || null; } catch (e) { return null; }
}
function notifSupported() {
  if (nativeBridge()) return true;
  try { return typeof Notification !== "undefined" && !!Notification.requestPermission; } catch (e) { return false; }
}
function notifStatus() {
  if (!notifSupported()) return "not available";
  if (nativeBridge()) return state.notifyOn ? "on" : "off";
  try {
    if (Notification.permission === "denied") return "blocked in settings";
    return state.notifyOn && Notification.permission === "granted" ? "on" : "off";
  } catch (e) { return "off"; }
}
function pushSchedule() {
  var nb = nativeBridge();
  if (!nb || !state.notifyOn) return;
  var items = [];
  for (var i = 0; i < 14; i++) {
    var dISO = addDays(today(), i), d = day(dISO);
    d.take.forEach(function (x) {
      if (!x.done && x.time) {
        var p = item(x.itemId);
        items.push({ date: dISO, time: x.time, title: "Time to take it", body: (p ? p.nm : "Item") + " · " + num(x.amount) + " " + x.unit });
      }
    });
    d.reminders.forEach(function (r) { if (!r.done && r.time) items.push({ date: dISO, time: r.time, title: "Reminder", body: r.text }); });
  }
  try { nb.postMessage(JSON.stringify(items)); } catch (e) {}
}
function enableNotif() {
  if (!notifSupported()) return;
  if (nativeBridge()) { state.notifyOn = true; save(); pushSchedule(); render(); return; }
  try {
    Notification.requestPermission().then(function (p) { state.notifyOn = p === "granted"; save(); render(); });
  } catch (e) {}
}
function checkNotif() {
  if (!state.notifyOn || nativeBridge()) return;
  try {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var d = state.days[today()];
    if (!d) return;
    var dirty = false, now = nowHM();
    (d.take || []).forEach(function (x) {
      if (!x.done && x.time && x.time <= now && !x.notified) {
        var p = item(x.itemId);
        new Notification("Time to take it", { body: (p ? p.nm : "Item") + " · " + num(x.amount) + " " + x.unit });
        x.notified = true; dirty = true;
      }
    });
    (d.reminders || []).forEach(function (r) {
      if (!r.done && r.time && r.time <= now && !r.notified) {
        new Notification("Reminder", { body: r.text });
        r.notified = true; dirty = true;
      }
    });
    if (dirty) save();
  } catch (e) {}
}

/* ============================================================
   render
   ============================================================ */
var TITLES = { today: ["Today", ""], plan: ["Plan", "Weekly"], stats: ["Stats", "Progress"], supply: ["Supply", "Stack"] };

function render() {
  document.documentElement.setAttribute("data-theme", state.theme === "light" ? "light" : "dark");
  var main = document.getElementById("main");
  var t = TITLES[tab];
  var sub = t[1], title = t[0], date = "";

  if (tab === "today") {
    var s = selISO();
    title = s === today() ? "Today" : DWL[wdOf(s)];
    sub = s === today() ? DWL[wdOf(s)] : "";
    date = shortDate(s);
  }
  if (tab === "plan" && editPlanId) {
    if (editWd !== null) { title = DWL[editWd]; sub = (plan(editPlanId) || {}).name || ""; }
    else { title = "Edit plan"; sub = "Weekly"; }
  }

  document.getElementById("topTitle").textContent = title;
  document.getElementById("topSub").textContent = sub;
  document.getElementById("topDate").textContent = date;
  document.getElementById("settingsBtn").hidden = tab !== "supply";

  main.innerHTML = tab === "today" ? viewToday()
    : tab === "plan" ? viewPlan()
    : tab === "stats" ? viewStats()
    : viewSupply();
  document.getElementById("sheetHost").innerHTML = viewSheet();

  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
    b.setAttribute("aria-current", String(b.dataset.tab === tab));
  });
  if (dayDirty) { dayDirty = false; save(); }
}

/* ============================================================
   rest timer
   ============================================================ */
var restLeft = 0, restTimer = null;
function fmtT(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function startRest(label) {
  restLeft = state.restSec || 90;
  var el = document.getElementById("rest");
  document.getElementById("restLb").textContent = "Rest · " + label;
  document.getElementById("restT").textContent = fmtT(restLeft);
  el.hidden = false;
  clearInterval(restTimer);
  restTimer = setInterval(function () {
    restLeft--;
    if (restLeft <= 0) { stopRest(); return; }
    document.getElementById("restT").textContent = fmtT(restLeft);
  }, 1000);
}
function stopRest() { clearInterval(restTimer); restTimer = null; document.getElementById("rest").hidden = true; }

/* ============================================================
   events — delegated, so no user text ever lands inside an attribute
   ============================================================ */
document.addEventListener("click", function (ev) {
  var el;

  /* tabs */
  el = ev.target.closest("nav button");
  if (el) { tab = el.dataset.tab; selDate = null; editPlanId = null; editWd = null; sheet = null; render(); document.getElementById("main").scrollTop = 0; return; }

  el = ev.target.closest("#settingsBtn");
  if (el) { openSheet({ kind: "settings" }); return; }

  /* sheet chrome */
  if (ev.target.closest("[data-close]") && !ev.target.closest(".sheetcard")) { closeSheet(); return; }
  el = ev.target.closest("[data-close]");
  if (el && el.tagName === "BUTTON") { closeSheet(); return; }

  el = ev.target.closest("[data-step]");
  if (el && sheet) {
    var unit = sheet.kind === "pr" || sheet.kind === "weight" ? "kg" : (item(sheet.itemId) || { dose: { u: "g" } }).dose.u;
    var st = sheet.kind === "pr" ? 2.5 : sheet.kind === "weight" ? 0.1 : stepFor(unit, sheet.amount);
    sheet.amount = Math.max(st, round(sheet.amount + st * (+el.dataset.step)));
    syncSheet();
    return;
  }
  el = ev.target.closest("[data-amt]");
  if (el && sheet) { sheet.amount = parseFloat(el.dataset.amt); syncSheet(); return; }

  el = ev.target.closest("[data-save]");
  if (el) { saveSheet(el.dataset.save); return; }

  el = ev.target.closest("[data-confirm]");
  if (el && sheet && sheet.fn) { var fn = sheet.fn; sheet = null; fn(); save(); render(); return; }

  el = ev.target.closest("[data-sheet]");
  if (el) {
    var kind = el.dataset.sheet;
    if (kind === "weight") {
      var lw = latestWeight();
      openSheet({ kind: "weight", amount: lw ? lw.kg : 80, date: today() });
    } else if (kind === "addex") {
      openSheet({ kind: "addex", ex: "new" });
    } else {
      openSheet({ kind: kind });
    }
    return;
  }

  /* today */
  el = ev.target.closest("[data-day]");
  if (el) { selDate = el.dataset.day; render(); return; }
  el = ev.target.closest("[data-goto]");
  if (el) { selDate = null; render(); return; }

  el = ev.target.closest("[data-set]");
  if (el) {
    var parts = el.dataset.set.split(":"), d = day(selISO());
    var e2 = d.exercises[+parts[0]], k = +parts[1];
    if (e2) {
      var was = !!e2.done[k];
      e2.done[k] = !was;
      d.userEdited = true;
      save(); render();
      if (!was) startRest(e2.name); else stopRest();
    }
    return;
  }

  el = ev.target.closest("[data-pr]");
  if (el) {
    var dd = day(selISO()), ee = dd.exercises[+el.dataset.pr];
    if (ee) {
      var cur = state.prs[keyOf(ee.name)];
      openSheet({ kind: "pr", ex: +el.dataset.pr, amount: Math.max(ee.kg || 0, cur ? cur.kg : 0) || 20, reps: ee.reps || 8 });
    }
    return;
  }

  el = ev.target.closest("[data-take]");
  if (el) {
    var i2 = +el.dataset.take, d2 = day(selISO());
    if (d2.take[i2].done) unlogTake(i2); else logTake(i2, d2.take[i2].amount, nowHM());
    render();
    return;
  }
  el = ev.target.closest("[data-takeedit]");
  if (el) {
    var i3 = +el.dataset.takeedit, x3 = day(selISO()).take[i3];
    if (x3 && !x3.done) openSheet({ kind: "log", itemId: x3.itemId, takeIdx: i3, amount: x3.amount, at: nowHM() });
    return;
  }

  el = ev.target.closest("[data-rem]");
  if (el) { var r = day(selISO()).reminders[+el.dataset.rem]; if (r) { r.done = !r.done; save(); render(); } return; }
  el = ev.target.closest("[data-remdel]");
  if (el) { var dr = day(selISO()); dr.reminders.splice(+el.dataset.remdel, 1); dr.userEdited = true; save(); render(); return; }

  /* plan */
  el = ev.target.closest("[data-editplan]");
  if (el) { editPlanId = el.dataset.editplan; editWd = null; render(); return; }
  el = ev.target.closest("[data-editday]");
  if (el) { var p2 = el.dataset.editday.split(":"); editPlanId = p2[0]; editWd = +p2[1]; render(); return; }
  el = ev.target.closest("[data-back]");
  if (el) { if (editWd !== null) editWd = null; else editPlanId = null; render(); return; }
  el = ev.target.closest("[data-activate]");
  if (el) { activatePlan(el.dataset.activate); render(); return; }
  el = ev.target.closest("[data-newplan]");
  if (el) {
    var np = { id: uid(), name: "Plan " + (state.plans.length + 1), status: "draft", days: {} };
    state.plans.push(np); editPlanId = np.id; editWd = null; save(); render();
    return;
  }
  el = ev.target.closest("[data-delplan]");
  if (el) {
    var pid = el.dataset.delplan, pn = (plan(pid) || {}).name || "";
    openSheet({ kind: "confirm", title: "Delete plan?", body: pn + " is removed. Your logged days stay.", fn: function () {
      state.plans = state.plans.filter(function (p) { return p.id !== pid; });
      if (state.activePlanId === pid) { state.activePlanId = null; bumpSched(); }
      editPlanId = null; editWd = null;
    } });
    return;
  }
  el = ev.target.closest("[data-pdex]");
  if (el) { openSheet({ kind: "pdex", ex: el.dataset.pdex === "new" ? "new" : +el.dataset.pdex }); return; }
  el = ev.target.closest("[data-pdtakedel]");
  if (el) { planDay(plan(editPlanId), editWd).take.splice(+el.dataset.pdtakedel, 1); pdChanged(); return; }
  el = ev.target.closest("[data-pdremdel]");
  if (el) { planDay(plan(editPlanId), editWd).reminders.splice(+el.dataset.pdremdel, 1); pdChanged(); return; }
  el = ev.target.closest("[data-delex]");
  if (el) {
    var di = +el.dataset.delex;
    if (sheet.kind === "pdex") { planDay(plan(editPlanId), editWd).exercises.splice(di, 1); sheet = null; pdChanged(); }
    else { var dz = day(selISO()); dz.exercises.splice(di, 1); dz.userEdited = true; sheet = null; save(); render(); }
    return;
  }

  el = ev.target.closest("[data-copyprompt]");
  if (el) { copyText(aiPrompt(), el, "Copy prompt"); return; }
  el = ev.target.closest("[data-copyexport]");
  if (el) { copyText(JSON.stringify(state), el, "Copy"); return; }

  /* supply */
  el = ev.target.closest("[data-log]");
  if (el) {
    var lp = item(el.dataset.log);
    if (lp) {
      var d4 = day(selISO());
      var idx = -1;
      d4.take.forEach(function (x, i) { if (x.itemId === lp.id && !x.done && idx < 0) idx = i; });
      if (idx < 0) {
        d4.take.push({ id: uid(), itemId: lp.id, amount: doseOn(lp, selISO()), unit: lp.dose.u,
                       moment: lp.moment || "Morning", time: "", done: false, at: "", histId: null });
        d4.userEdited = true;
        idx = d4.take.length - 1;
      }
      openSheet({ kind: "log", itemId: lp.id, takeIdx: idx, amount: doseOn(lp, selISO()), at: nowHM() });
    }
    return;
  }
  el = ev.target.closest("[data-refill]");
  if (el) {
    var rp = item(el.dataset.refill);
    if (rp) openSheet({ kind: "confirm", title: "New " + form(rp).container + "?", body: rp.nm + " goes back to " + num(rp.cont.n) + " " + rp.cont.u + ".", fn: function () { rp.left = rp.cont.n; } });
    return;
  }
  el = ev.target.closest("[data-edititem]");
  if (el) { openSheet({ kind: "edititem", itemId: el.dataset.edititem }); return; }
  el = ev.target.closest("[data-delitem]");
  if (el) {
    var xid = el.dataset.delitem, xn = (item(xid) || {}).nm || "";
    openSheet({ kind: "confirm", title: "Remove " + xn + "?", body: "It is taken out of your plans too. Your log stays.", fn: function () {
      state.stack = state.stack.filter(function (p) { return p.id !== xid; });
      state.plans.forEach(function (pl) {
        Object.keys(pl.days || {}).forEach(function (wd) {
          pl.days[wd].take = (pl.days[wd].take || []).filter(function (t) { return t.itemId !== xid; });
        });
      });
      bumpSched();
    } });
    return;
  }
  el = ev.target.closest("[data-delstep]");
  if (el) {
    var sp2 = item(sheet.itemId);
    if (sp2) { sp2.steps = (sp2.steps || []).filter(function (s) { return s.id !== el.dataset.delstep; }); bumpSched(); save(); render(); }
    return;
  }

  /* stats */
  el = ev.target.closest("[data-range]");
  if (el) { RANGE = el.dataset.range; render(); return; }

  /* settings */
  el = ev.target.closest("[data-notif]");
  if (el) {
    if (el.dataset.notif === "on") enableNotif();
    else { state.notifyOn = false; save(); render(); }
    return;
  }
  el = ev.target.closest("[data-theme]");
  if (el) { state.theme = state.theme === "light" ? "dark" : "light"; save(); render(); return; }
  el = ev.target.closest("[data-wipe]");
  if (el) {
    openSheet({ kind: "confirm", title: "Erase everything?", body: "Stack, plans and log all go. This cannot be undone.", fn: function () {
      var theme = state.theme;
      state = clone(BLANK); state.theme = theme;
      editPlanId = null; editWd = null; tab = "today";
    } });
    return;
  }
});

document.addEventListener("input", function (ev) {
  if (!sheet || ev.target.id !== "amtInput") return;
  var v = parseFloat(String(ev.target.value).replace(",", "."));
  if (!isNaN(v) && v > 0) { sheet.amount = round(v); syncSheet(); }
});

function copyText(txt, btn, back) {
  var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = back; }, 1800); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
    } else fallbackCopy(txt, done);
  } catch (e) { fallbackCopy(txt, done); }
}
function fallbackCopy(txt, done) {
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function pdChanged() {
  if (editPlanId === state.activePlanId) bumpSched();
  sheet = null; save(); render();
}
function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }
function numVal(id, def) { var v = parseFloat(String(val(id)).replace(",", ".")); return isNaN(v) ? def : v; }

function saveSheet(what) {
  if (what === "log") {
    var at = val("logTime") || nowHM();
    logTake(sheet.takeIdx, sheet.amount, at);
    closeSheet();
    return;
  }
  if (what === "pr") {
    var d = day(selISO()), e = d.exercises[sheet.ex];
    if (e) {
      state.prs[keyOf(e.name)] = { name: e.name, kg: round(sheet.amount), reps: Math.max(1, parseInt(val("prReps"), 10) || e.reps), date: selISO() };
      save();
    }
    closeSheet();
    return;
  }
  if (what === "weight") {
    var date = val("wDate") || today();
    state.weights = state.weights.filter(function (w) { return w.date !== date; });
    state.weights.push({ date: date, kg: round(sheet.amount) });
    save(); closeSheet();
    return;
  }
  if (what === "item") {
    var nm = val("iNm").trim();
    if (!nm) return;
    var kind = val("iKind") || "powder";
    var unit = FORM[kind].unit;
    var cont = numVal("iCont", 0), dose = numVal("iDose", 0), perWeek = Math.max(1, parseInt(val("iWeek"), 10) || 7);
    var moment = val("iMoment") || "Morning", hint = val("iHint").trim();
    if (sheet.kind === "edititem") {
      var it = item(sheet.itemId);
      if (it) {
        it.nm = nm; it.kind = kind;
        it.cont = { n: cont, u: unit }; it.dose = { n: dose, u: unit };
        it.left = Math.max(0, numVal("iLeft", it.left));
        it.perWeek = perWeek; it.moment = moment; it.hint = hint;
      }
    } else {
      state.stack.push({ id: uid(), nm: nm, kind: kind, moment: moment,
        cont: { n: cont, u: unit }, dose: { n: dose, u: unit }, left: cont, perWeek: perWeek, hint: hint, steps: [] });
    }
    bumpSched(); save(); closeSheet();
    return;
  }
  if (what === "step") {
    var sp = item(sheet.itemId);
    var n = numVal("stN", 0), from = val("stFrom");
    if (sp && n > 0 && from) {
      if (!sp.steps) sp.steps = [];
      sp.steps.push({ id: uid(), from: from, n: round(n) });
      bumpSched(); save(); render();
    }
    return;
  }
  if (what === "ex") {
    var name = val("eNm").trim();
    if (!name) return;
    var sets = Math.max(1, parseInt(val("eSets"), 10) || 3);
    var reps = Math.max(1, parseInt(val("eReps"), 10) || 10);
    var kg = numVal("eKg", 0);
    if (sheet.kind === "pdex") {
      var pd = planDay(plan(editPlanId), editWd);
      if (sheet.ex === "new") pd.exercises.push({ name: name, sets: sets, reps: reps, kg: kg, note: "" });
      else { var pe = pd.exercises[sheet.ex]; pe.name = name; pe.sets = sets; pe.reps = reps; pe.kg = kg; }
      pdChanged();
    } else {
      var dd = day(selISO());
      if (sheet.ex === "new") dd.exercises.push({ id: uid(), name: name, sets: sets, reps: reps, kg: kg, note: "", done: new Array(sets).fill(false) });
      else {
        var de = dd.exercises[sheet.ex];
        de.name = name; de.reps = reps; de.kg = kg;
        if (de.sets !== sets) { de.sets = sets; de.done = new Array(sets).fill(false).map(function (_, i) { return !!de.done[i]; }); }
      }
      dd.userEdited = true; save(); closeSheet();
    }
    return;
  }
  if (what === "pdtake") {
    var pd2 = planDay(plan(editPlanId), editWd);
    pd2.take.push({ id: uid(), itemId: val("tItem"), moment: val("tMoment") || "Morning", time: val("tTime") });
    pdChanged();
    return;
  }
  if (what === "note") { var dn = day(selISO()); dn.notes = val("nText").trim(); dn.userEdited = true; save(); closeSheet(); return; }
  if (what === "pdnote") { planDay(plan(editPlanId), editWd).notes = val("nText").trim(); pdChanged(); return; }
  if (what === "reminder") {
    var txt = val("rText").trim();
    if (!txt) return;
    var dq = day(selISO());
    dq.reminders.push({ id: uid(), text: txt, time: val("rTime"), done: false });
    dq.userEdited = true; save(); closeSheet(); pushSchedule();
    return;
  }
  if (what === "pdreminder") {
    var rt = val("rText").trim();
    if (!rt) return;
    planDay(plan(editPlanId), editWd).reminders.push({ text: rt, time: val("rTime") });
    pdChanged();
    return;
  }
  if (what === "planname") { var pl3 = plan(editPlanId); if (pl3) pl3.name = val("pName").trim() || pl3.name; save(); closeSheet(); return; }
  if (what === "pdname") { planDay(plan(editPlanId), editWd).workoutName = val("pName").trim(); pdChanged(); return; }
  if (what === "import") {
    var err = importPlan(val("impText"));
    var hint = document.getElementById("impHint");
    if (err) { if (hint) { hint.textContent = err; hint.style.color = "var(--dgr)"; } return; }
    tab = "plan"; closeSheet();
    return;
  }
  if (what === "restore") {
    var parsed = null;
    try { parsed = JSON.parse(val("resText")); } catch (e) {}
    var rh = document.getElementById("resHint");
    if (!parsed || typeof parsed !== "object") {
      if (rh) { rh.textContent = "That is not a backup this app wrote."; rh.style.color = "var(--dgr)"; }
      return;
    }
    state = upgrade(parsed);
    editPlanId = null; editWd = null; tab = "today"; selDate = null;
    save(); closeSheet();
    return;
  }
}

/* ============================================================
   start
   ============================================================ */
function init() {
  load();
  render();

  /* cloud copy when the app runs inside Claude; ignored in the iPhone build */
  try {
    if (window.claude && window.claude.use) {
      Promise.resolve(claude.use("db")).then(function (d) {
        db = d;
        if (!db) return;
        return db.doc("app/state").get().then(function (snap) {
          if (snap && snap.exists) { state = upgrade(snap.data()); render(); }
          else if (state.stack.length || Object.keys(state.days).length) save();
        });
      }).catch(function () { db = null; });
    }
  } catch (e) { db = null; }

  pushSchedule();
  setInterval(checkNotif, 30000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { save(); pushSchedule(); }
  });
  window.addEventListener("pagehide", function () { save(); pushSchedule(); });

  document.getElementById("restPlus").addEventListener("click", function () {
    restLeft += 30; document.getElementById("restT").textContent = fmtT(restLeft);
  });
  document.getElementById("restSkip").addEventListener("click", stopRest);
}

init();
</script>
