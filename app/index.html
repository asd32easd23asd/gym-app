<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* Dark is the default look. Light is a full second palette, not an inversion. */
:root {
  color-scheme: dark;
  --bg: #0F1316; --surf: #171D20; --raise: #202830; --line: #2B343A;
  --txt: #E9EEEF; --mut: #99A5AB; --dim: #808C92;
  --acc: #45C9BA; --acc-ink: #04211E; --acc-soft: #123430;
  --ok: #63BE79; --warn: #E3B341; --dgr: #E0736C;
  --s1: #2FA79B; --s2: #8A7ADB; --s3: #C0705A;
  --grid: #262E33;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F1F4F4; --surf: #FFFFFF; --raise: #E9EEED; --line: #D8DFDE;
  --txt: #0F1618; --mut: #56646A; --dim: #6C7A7F;
  --acc: #0E7C72; --acc-ink: #FFFFFF; --acc-soft: #E0F0EE;
  --ok: #2E8049; --warn: #8F5E06; --dgr: #B4453F;
  --s1: #068C80; --s2: #6046C4; --s3: #A8533B;
  --grid: #E2E8E7;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--txt);
  font-family: var(--sans); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
input, select, textarea, button { font-family: inherit; }
[hidden] { display: none !important; }

#app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; position: relative; }

/* ---- chrome ---- */
.top {
  flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 18px 12px; border-bottom: 1px solid var(--line);
}
.top h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
.top .sub { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: block; margin-bottom: 3px; }
.top .right { display: flex; align-items: center; gap: 8px; }
.top .date { font-family: var(--mono); font-size: 12px; color: var(--mut); }

main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 13px; }

nav {
  flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line); background: var(--surf);
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom, 0px));
}
nav button {
  border: 0; background: none; cursor: pointer; color: var(--dim);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600; padding: 5px 0 3px; min-height: 48px; border-radius: 12px;
}
nav button[aria-current="true"] { color: var(--acc); }
nav svg { stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---- blocks ---- */
.card { background: var(--surf); border: 1px solid var(--line); border-radius: 18px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
.card.soon { border-style: dashed; }
.chead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.chead h2 { font-size: 14px; font-weight: 700; margin: 0; }
.note { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--dim); font-size: 13px; padding: 14px 0; }
.hint { font-size: 12.5px; color: var(--mut); }
.hint b { color: var(--txt); font-weight: 600; }

.chip {
  font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 6px;
  background: var(--raise); color: var(--mut); white-space: nowrap;
}
.chip.acc { background: var(--acc-soft); color: var(--acc); }
.chip.warn { background: rgba(227,179,65,.18); color: var(--warn); }
.chip.ok { background: rgba(99,190,121,.18); color: var(--ok); }

.btn {
  font-size: 14px; font-weight: 700; cursor: pointer; border: 0; border-radius: 13px;
  background: var(--acc); color: var(--acc-ink); min-height: 46px; padding: 12px 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.ghost { background: var(--raise); color: var(--txt); }
.btn.line { background: none; color: var(--txt); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: rgba(224,115,108,.14); color: var(--dgr); }
.btn.sm { min-height: 38px; font-size: 13px; padding: 8px 14px; border-radius: 10px; }
.btnrow { display: flex; gap: 9px; }
.btnrow > * { flex: 1; }
.btnrow .fixed { flex: 0 0 auto; }
.icon {
  width: 38px; height: 38px; min-width: 38px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--raise); color: var(--txt); display: flex; align-items: center; justify-content: center;
}
.icon svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wday {
  border: 0; cursor: pointer; background: var(--surf); color: var(--txt); border-radius: 13px;
  padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-height: 58px; box-shadow: inset 0 0 0 1px var(--line);
}
.wday .dw { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .08em; color: var(--dim); }
.wday .dd { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wday .dots { display: flex; gap: 3px; height: 5px; align-items: center; }
.wday .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
.wday.sel { box-shadow: inset 0 0 0 2px var(--acc); }
.wday.today { background: var(--acc); box-shadow: none; }
.wday.today .dw, .wday.today .dd { color: var(--acc-ink); }

/* summary */
.summary { display: flex; align-items: center; gap: 16px; }
.dial { position: relative; width: 78px; height: 78px; flex: 0 0 auto; }
.dial .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dial .big, .dial .cap { display: block; }
.dial .big { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.dial .cap { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.sumlist { flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sumrow { display: flex; align-items: center; gap: 9px; font-size: 13px; width: 100%; background: none; border: 0; color: inherit; padding: 0; text-align: left; }
button.sumrow { cursor: pointer; }
.sumrow .lbl { color: var(--mut); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sumrow .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.stripe { width: 3px; border-radius: 2px; align-self: stretch; min-height: 16px; }

/* exercises */
.ex { display: flex; flex-direction: column; gap: 9px; padding: 12px 0; border-top: 1px solid var(--line); }
.ex:first-of-type { border-top: 0; padding-top: 2px; }
.exhead { display: flex; align-items: baseline; gap: 10px; }
.exhead .nm { font-size: 14.5px; font-weight: 700; flex: 1 1 auto; }
.exhead .tgt { font-family: var(--mono); font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; }
.exmeta { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.exmeta .txt { flex: 1 1 auto; min-width: 0; }
.exmeta b { color: var(--mut); font-weight: 500; font-family: var(--mono); }
.sets { display: flex; gap: 7px; flex-wrap: wrap; }
.set {
  width: 44px; height: 44px; border-radius: 12px; border: 0; cursor: pointer;
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  background: var(--raise); color: var(--mut);
  display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--line);
  transition: background-color .15s ease, color .15s ease, transform .1s ease;
}
.set.done { background: var(--acc); color: var(--acc-ink); box-shadow: none; }
.set:active { transform: scale(.93); }
.prbtn {
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; cursor: pointer;
  border: 0; border-radius: 9px; background: var(--raise); color: var(--mut);
  box-shadow: inset 0 0 0 1px var(--line); min-height: 34px; padding: 7px 11px;
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
}
.prbtn.hot { background: rgba(227,179,65,.18); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.prbtn svg { stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.bar { display: flex; align-items: center; gap: 8px; }
.bar .track { flex: 1 1 auto; height: 5px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.bar .fill { display: block; height: 100%; border-radius: 3px; background: var(--acc); transition: width .25s ease; }
.bar .pct { font-family: var(--mono); font-size: 11px; color: var(--mut); font-variant-numeric: tabular-nums; }

/* stack rows */
.moment { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 4px; border-top: 1px solid var(--line); }
.card > .moment:first-of-type { border-top: 0; padding-top: 0; }
.row { display: flex; align-items: center; gap: 11px; }
.tick {
  width: 32px; height: 32px; min-width: 32px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: var(--raise); box-shadow: inset 0 0 0 2px var(--line);
  display: flex; align-items: center; justify-content: center;
}
.tick.done { background: var(--ok); box-shadow: none; }
.tick svg { stroke: var(--bg); fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.rbody { flex: 1 1 auto; min-width: 0; background: none; border: 0; color: inherit; text-align: left; padding: 0; }
button.rbody { cursor: pointer; }
.rbody .nm, .rbody .sub { display: block; }
.rbody .nm { font-size: 14px; font-weight: 700; }
.rbody .sub { font-size: 11.5px; color: var(--dim); font-family: var(--mono); }
.strike { text-decoration: line-through; color: var(--mut); }
.xbtn { width: 38px; height: 38px; min-width: 38px; border: 0; border-radius: 10px; background: none; color: var(--dim); cursor: pointer; font-size: 17px; }

/* supply */
.vial { display: flex; gap: 15px; align-items: center; }
.vialstats { flex: 1 1 auto; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.kv .k { color: var(--mut); }
.kv .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.rule { height: 9px; display: block; width: 100%; opacity: .85; }

/* titration */
.steps { display: flex; flex-direction: column; }
.step { display: flex; gap: 12px; }
.step .rail { display: flex; flex-direction: column; align-items: center; width: 12px; flex: 0 0 auto; }
.step .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--raise); box-shadow: inset 0 0 0 2px var(--line); }
.step.past .dot { background: var(--acc); opacity: .45; box-shadow: none; }
.step.now .dot { background: var(--acc); box-shadow: 0 0 0 4px var(--acc-soft); }
.step .line { width: 2px; flex: 1 1 auto; background: var(--line); min-height: 16px; }
.step .txt { padding-bottom: 13px; flex: 1 1 auto; }
.step:last-child .txt { padding-bottom: 0; }
.step .d1, .step .d2 { display: block; }
.step .d1 { font-family: var(--mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.step.next .d1 { color: var(--mut); }
.step.now .d1 { color: var(--acc); }
.step .d2 { font-size: 11px; color: var(--dim); }

/* plan */
.prow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; text-align: left; cursor: pointer; }
.prow:first-of-type { border-top: 0; }
.prow .dw { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--acc); width: 26px; flex: 0 0 auto; letter-spacing: .06em; }
.prow .b { flex: 1 1 auto; min-width: 0; }
.prow .t1, .prow .t2 { display: block; }
.prow .t1 { font-size: 14px; font-weight: 700; }
.prow .t1.restday { color: var(--dim); font-weight: 600; }
.prow .t2 { font-size: 11.5px; color: var(--dim); font-family: var(--mono); }
.prow svg { stroke: var(--dim); fill: none; stroke-width: 2.4; stroke-linecap: round; }

/* stats */
.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.stat { background: var(--surf); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.025em; }
.stat .v s { text-decoration: none; font-size: 11px; color: var(--mut); font-weight: 600; }
.stat .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
.seg { display: flex; gap: 6px; }
.seg button {
  flex: 1; font-family: var(--mono); font-size: 11px; font-weight: 600; cursor: pointer; border: 0;
  border-radius: 10px; background: var(--raise); color: var(--mut); min-height: 36px; padding: 7px 4px;
  box-shadow: inset 0 0 0 1px var(--line);
}
.seg button[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }

/* rest timer */
.rest {
  position: absolute; left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  background: var(--acc); color: var(--acc-ink); border-radius: 16px; padding: 11px 13px;
  display: flex; align-items: center; gap: 11px; box-shadow: 0 12px 30px rgba(0,0,0,.34); z-index: 4;
}
.rest .t { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; min-width: 62px; }
.rest .lb { flex: 1 1 auto; font-size: 12px; font-weight: 600; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rest button { font-family: var(--mono); font-size: 12px; font-weight: 600; cursor: pointer; border: 0; border-radius: 9px; background: rgba(0,0,0,.16); color: inherit; min-height: 34px; padding: 6px 11px; }

/* sheet */
.sheet { position: absolute; inset: 0; z-index: 6; display: flex; align-items: flex-end; background: rgba(0,0,0,.55); }
.sheetcard {
  width: 100%; background: var(--surf); border-top: 1px solid var(--line);
  border-radius: 22px 22px 0 0; padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 13px; max-height: 94%; overflow-y: auto;
}
.sheetcard h2 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -.015em; }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 14px; }
.stepper button {
  width: 52px; height: 52px; min-width: 52px; border: 0; cursor: pointer; border-radius: 17px;
  background: var(--raise); color: var(--txt); font-size: 24px; font-weight: 700; line-height: 1;
  box-shadow: inset 0 0 0 1px var(--line);
}
.stepper .val { text-align: center; min-width: 130px; }
.stepper .val .n {
  font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  display: block; line-height: 1.05; width: 100%; background: none; border: 0; color: var(--txt);
  text-align: center; padding: 2px 0; border-bottom: 2px dashed var(--line);
}
.stepper .val .n:focus { outline: none; border-bottom-color: var(--acc); }
.stepper .val .u { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.quick { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
.quick button {
  font-family: var(--mono); font-size: 11.5px; font-weight: 600; cursor: pointer; border: 0;
  border-radius: 9px; background: var(--raise); color: var(--mut); min-height: 38px; padding: 8px 13px;
  box-shadow: inset 0 0 0 1px var(--line);
}
.quick button[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.f { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--mut); font-weight: 600; }
.f input, .f select, .f textarea {
  background: var(--raise); border: 1px solid var(--line); border-radius: 12px; color: var(--txt);
  font-size: 16px; font-weight: 500; padding: 12px 14px; outline: none; width: 100%;
}
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--acc); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.fields { display: flex; flex-direction: column; gap: 10px; }
.soonlist { opacity: .45; pointer-events: none; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <div>
      <span class="sub" id="topSub"></span>
      <h1 id="topTitle">Today</h1>
    </div>
    <div class="right">
      <span class="date" id="topDate"></span>
      <button class="icon" id="settingsBtn" aria-label="Settings" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.2.63.78 1.07 1.44 1.11H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.89z"/></svg>
      </button>
    </div>
  </div>

  <main id="main"></main>
  <div id="sheetHost"></div>

  <div class="rest" id="rest" hidden>
    <span class="t" id="restT">1:30</span>
    <span class="lb" id="restLb">Rest</span>
    <button type="button" id="restPlus">+30s</button>
    <button type="button" id="restSkip">Skip</button>
  </div>

  <nav aria-label="Tabs">
    <button type="button" data-tab="today" aria-current="true">
      <svg width="21" height="21" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Today</button>
    <button type="button" data-tab="plan" aria-current="false">
      <svg width="21" height="21" viewBox="0 0 24 24"><path d="M6 6.5v11M18 6.5v11M3 9.5v5M21 9.5v5M6 12h12"/></svg>Plan</button>
    <button type="button" data-tab="stats" aria-current="false">
      <svg width="21" height="21" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Stats</button>
    <button type="button" data-tab="supply" aria-current="false">
      <svg width="21" height="21" viewBox="0 0 24 24"><path d="M5 8h14v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8zM4 4.5h16v3.5H4zM10 12h4"/></svg>Supply</button>
  </nav>
</div>

<script>
"use strict";

/* ============================================================
   state
   ============================================================ */
var LS_KEY = "gympep-state-v1";          /* same key: v1 data is read and upgraded in place */
var BLANK = { v: 2, stack: [], plans: [], activePlanId: null, planLog: [], days: {},
              history: [], prs: {}, weights: [], schedVer: 0, notifyOn: false, restSec: 90, theme: "dark" };

var state = clone(BLANK);
var db = null, saveTimer = null;
var tab = "today", selDate = null, sheet = null;
var editPlanId = null, editWd = null;
var dayDirty = false;   /* a day was just built from the plan and needs writing */

var DW = ["MO","TU","WE","TH","FR","SA","SU"];
var DWL = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MOMENTS = ["Morning", "Pre-workout", "Post-workout", "Evening"];
var FORM = {
  inject:  { label: "Vial",   container: "vial",   unit: "mg" },
  powder:  { label: "Powder", container: "tub",    unit: "g" },
  capsule: { label: "Pills",  container: "jar",    unit: "caps" },
  liquid:  { label: "Liquid", container: "bottle", unit: "ml" }
};
var KEEP_DAYS = 550;                      /* days are pruned past this, so storage cannot grow forever */

/* ============================================================
   small helpers
   ============================================================ */
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid() { return Math.random().toString(36).slice(2, 10); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function iso(d) {
  var x = d || new Date();
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}
function today() { return iso(); }
function parseISO(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function shortDate(s) { var d = parseISO(s); return d.getDate() + " " + MONTHS[d.getMonth()]; }
function wdOf(s) { return (parseISO(s).getDay() + 6) % 7; }
function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function num(v, dec) {
  var n = Number(v) || 0;
  var s = dec == null ? String(Math.round(n * 1000) / 1000) : n.toFixed(dec);
  return s;
}
function round(v) { return Math.round(Number(v) * 1000) / 1000; }
function nowHM() { return new Date().toTimeString().slice(0, 5); }
function keyOf(name) { return String(name || "").trim().toLowerCase(); }

/* ============================================================
   stack maths — amounts and supply only, never how to take it
   ============================================================ */
function item(id) { for (var i = 0; i < state.stack.length; i++) if (state.stack[i].id === id) return state.stack[i]; return null; }
function form(p) { return FORM[p.kind] || FORM.powder; }
function doseOn(p, dateISO) {
  var n = p.dose.n;
  (p.steps || []).slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; })
    .forEach(function (s) { if (s.from <= dateISO) n = s.n; });
  return n;
}
function nextStep(p, dateISO) {
  var f = (p.steps || []).filter(function (s) { return s.from > dateISO; })
    .sort(function (a, b) { return a.from < b.from ? -1 : 1; });
  return f[0] || null;
}
function servings(p) { var d = doseOn(p, today()); return d > 0 ? Math.floor(p.left / d + 1e-9) : 0; }
function daysLeft(p) { var w = p.perWeek || 7; return Math.floor(servings(p) * 7 / w); }
function isLow(p) { return daysLeft(p) <= 14; }
function amountLabel(p, dateISO) { return num(doseOn(p, dateISO || today())) + " " + p.dose.u; }

/* ============================================================
   load, migrate, save
   ============================================================ */
function load() {
  var raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  if (!raw) return;
  var parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { return; }
  var wasOld = parsed.v !== 2;
  state = upgrade(parsed);
  /* write the upgraded shape straight back, so v1 data is converted once and not on every open */
  if (wasOld) { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
}

/* v1 kept peptides, weekday templates and exercises as free text.
   everything below turns that into the v2 shapes without losing anything. */
function parseDetail(detail) {
  var out = { sets: 3, reps: 10, kg: 0, note: "" };
  var s = String(detail || "");
  var m = s.match(/(\d+)\s*[x×]\s*(\d+)/i);
  if (m) { out.sets = +m[1]; out.reps = +m[2]; }
  var w = s.match(/(\d+(?:[.,]\d+)?)\s*kg/i);
  if (w) out.kg = parseFloat(w[1].replace(",", "."));
  if (!m && !w) out.note = s.trim();
  return out;
}

function upgrade(old) {
  if (!old || typeof old !== "object") return clone(BLANK);
  if (old.v === 2) {
    var s2 = Object.assign(clone(BLANK), old);
    s2.stack = s2.stack || []; s2.prs = s2.prs || {}; s2.weights = s2.weights || [];
    return s2;
  }

  var s = clone(BLANK);
  s.plans = [];
  s.activePlanId = old.activePlanId || null;
  s.planLog = old.planLog || [];
  s.schedVer = old.schedVer || 0;
  s.notifyOn = !!old.notifyOn;

  /* peptides -> stack items with the Vial form */
  var idMap = {};
  (old.peptides || []).forEach(function (p) {
    var it = {
      id: uid(), nm: p.name || "Item", kind: "inject", moment: "Morning",
      cont: { n: Number(p.vialMg) || 10, u: "mg" },
      dose: { n: Number(p.doseMg) || 1, u: "mg" },
      left: Number(p.remainingMg) || 0, perWeek: 1, hint: "",
      steps: (p.plan || []).map(function (st) { return { id: uid(), from: st.from, n: Number(st.mg) || 0 }; })
    };
    idMap[p.id] = it.id;
    s.stack.push(it);
  });

  /* weekday templates -> a plan; old free-text exercises get parsed into sets/reps/kg */
  function convDays(srcDays) {
    var out = {};
    Object.keys(srcDays || {}).forEach(function (wd) {
      var d = srcDays[wd] || {};
      out[wd] = {
        workoutName: d.workoutName || d.name || "",
        exercises: (d.exercises || []).map(function (e) {
          var p = parseDetail(e.detail);
          return { name: e.name || "", sets: p.sets, reps: p.reps, kg: p.kg, note: p.note };
        }).filter(function (e) { return e.name; }),
        take: (d.doses || []).map(function (ds) {
          return idMap[ds.pepId] ? { id: uid(), itemId: idMap[ds.pepId], moment: "Morning", time: ds.time || "" } : null;
        }).filter(Boolean),
        notes: d.notes || "",
        reminders: (d.reminders || []).map(function (r) { return { text: r.text || "", time: r.time || "" }; })
      };
    });
    return out;
  }

  (old.plans || []).forEach(function (pl) {
    s.plans.push({ id: pl.id, name: pl.name || "Plan", status: pl.status || "draft", days: convDays(pl.days) });
  });

  /* the even older tpl/rules model, if a plan was never created from it */
  if (!s.plans.length && old.tpl && Object.keys(old.tpl).length) {
    var pl2 = { id: uid(), name: "My plan", status: "active", days: {} };
    Object.keys(old.tpl).forEach(function (wd) {
      pl2.days[wd] = {
        workoutName: old.tpl[wd].name || "",
        exercises: (old.tpl[wd].exercises || []).map(function (e) {
          var p = parseDetail(e.detail);
          return { name: e.name || "", sets: p.sets, reps: p.reps, kg: p.kg, note: p.note };
        }).filter(function (e) { return e.name; }),
        take: [], notes: "", reminders: []
      };
    });
    (old.rules || []).forEach(function (r) {
      var wds = r.days === "daily" ? [0, 1, 2, 3, 4, 5, 6] : (r.days || []);
      wds.forEach(function (wd) {
        if (!pl2.days[wd]) pl2.days[wd] = { workoutName: "", exercises: [], take: [], notes: "", reminders: [] };
        if (idMap[r.pepId]) pl2.days[wd].take.push({ id: uid(), itemId: idMap[r.pepId], moment: "Morning", time: r.time || "" });
      });
    });
    s.plans.push(pl2);
    s.activePlanId = pl2.id;
    s.planLog.push({ planId: pl2.id, from: today() });
  }

  /* how often per week each item is actually taken, read off the active plan */
  var act = s.plans.filter(function (p) { return p.id === s.activePlanId; })[0] || s.plans[0];
  if (act) {
    s.stack.forEach(function (it) {
      var n = 0;
      Object.keys(act.days || {}).forEach(function (wd) {
        (act.days[wd].take || []).forEach(function (t) { if (t.itemId === it.id) n++; });
      });
      it.perWeek = n || 1;
    });
  }

  /* logged days */
  Object.keys(old.days || {}).forEach(function (d) {
    var od = old.days[d] || {};
    s.days[d] = {
      workoutName: od.workoutName || "",
      exercises: (od.exercises || []).map(function (e) {
        var p = parseDetail(e.detail);
        return { id: e.id || uid(), name: e.name || "", sets: p.sets, reps: p.reps, kg: p.kg, note: p.note,
                 done: new Array(p.sets).fill(!!e.done) };
      }),
      take: (od.doses || []).map(function (x) {
        return { id: x.id || uid(), itemId: idMap[x.pepId] || null, amount: Number(x.mg) || 0, unit: "mg",
                 moment: "Morning", time: x.time || "", done: !!x.done, at: x.at || "", histId: null };
      }).filter(function (x) { return x.itemId; }),
      notes: od.notes || "",
      reminders: (od.reminders || []).map(function (r) {
        return { id: r.id || uid(), text: r.text || "", time: r.time || "", done: !!r.done };
      }),
      userEdited: !!od.userEdited,
      tplV: -1
    };
  });

  (old.history || []).forEach(function (h) {
    s.history.push({ id: h.id || uid(), date: h.date, at: h.at || "", name: h.name || "", amount: Number(h.mg) || 0, unit: "mg" });
  });

  return s;
}

function save() {
  prune();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    if (db) { try { db.doc("app/state").set(clone(state)); } catch (e) {} }
  }, 700);
}

/* days older than KEEP_DAYS go; without this the store grows for ever */
function prune() {
  var cut = addDays(today(), -KEEP_DAYS);
  Object.keys(state.days).forEach(function (d) { if (d < cut) delete state.days[d]; });
  if (state.history.length > 2000) state.history = state.history.slice(0, 2000);
}

/* ============================================================
   the day: built from the active plan until you touch it
   ============================================================ */
function schedVer() { return state.schedVer || 0; }
function bumpSched() { state.schedVer = schedVer() + 1; }
function plan(id) { for (var i = 0; i < state.plans.length; i++) if (state.plans[i].id === id) return state.plans[i]; return null; }
function activePlan() { return plan(state.activePlanId); }
function planDay(pl, wd) {
  if (!pl.days) pl.days = {};
  if (!pl.days[wd]) pl.days[wd] = { workoutName: "", exercises: [], take: [], notes: "", reminders: [] };
  var d = pl.days[wd];
  if (!d.take) d.take = [];
  if (!d.reminders) d.reminders = [];
  if (!d.exercises) d.exercises = [];
  return d;
}

function day(dateISO) {
  if (!state.days[dateISO]) {
    state.days[dateISO] = { workoutName: "", exercises: [], take: [], notes: "", reminders: [], userEdited: false, tplV: -1 };
  }
  var d = state.days[dateISO];
  if (!d.exercises) d.exercises = [];
  if (!d.take) d.take = [];
  if (!d.reminders) d.reminders = [];
  if (d.notes === undefined) d.notes = "";

  var touched = d.userEdited
    || d.exercises.some(function (e) { return (e.done || []).some(Boolean); })
    || d.take.some(function (t) { return t.done; })
    || d.reminders.some(function (r) { return r.done; });

  if (d.tplV !== schedVer() && !touched && dateISO >= today()) {
    var ap = activePlan();
    var pd = ap && ap.days ? ap.days[wdOf(dateISO)] : null;
    if (pd) {
      d.workoutName = pd.workoutName || "";
      d.exercises = (pd.exercises || []).map(function (e) {
        return { id: uid(), name: e.name, sets: e.sets || 3, reps: e.reps || 10, kg: e.kg || 0, note: e.note || "",
                 done: new Array(e.sets || 3).fill(false) };
      });
      d.take = (pd.take || []).map(function (t) {
        var p = item(t.itemId);
        return p ? { id: uid(), itemId: t.itemId, amount: doseOn(p, dateISO), unit: p.dose.u,
                     moment: t.moment || p.moment || "Morning", time: t.time || "", done: false, at: "", histId: null } : null;
      }).filter(Boolean);
      d.notes = pd.notes || "";
      d.reminders = (pd.reminders || []).map(function (r) { return { id: uid(), text: r.text, time: r.time || "", done: false }; });
    } else {
      d.workoutName = ""; d.exercises = []; d.take = []; d.notes = ""; d.reminders = [];
    }
    d.tplV = schedVer();
    dayDirty = true;
  }
  return d;
}

function selISO() { return selDate || today(); }
function weekOf(anchor) {
  var start = addDays(anchor, -wdOf(anchor));
  var out = [];
  for (var i = 0; i < 7; i++) out.push(addDays(start, i));
  return out;
}

/* ============================================================
   svg bits
   ============================================================ */
function checkIcon() { return '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'; }
function chevron() { return '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'; }
function tickRule() {
  var s = '<svg class="rule" viewBox="0 0 120 9" preserveAspectRatio="none" aria-hidden="true">';
  for (var i = 0; i <= 120; i += 4) s += '<line x1="' + i + '" y1="' + (i % 20 === 0 ? 0 : 3.5) + '" x2="' + i + '" y2="9" stroke="var(--line)" stroke-width="1"/>';
  return s + "</svg>";
}
function ring(pct, size, color, big, cap) {
  var r = size / 2 - 5, c = 2 * Math.PI * r;
  return '<div class="dial" style="width:' + size + 'px;height:' + size + 'px"><svg viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--raise)" stroke-width="7"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="7" stroke-linecap="round" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - pct)).toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/></svg>' +
    '<div class="inner"><span class="big">' + big + '</span><span class="cap">' + cap + "</span></div></div>";
}

/* ============================================================
   charts
   ============================================================ */
function lineChart(values, labels, color, unit) {
  var W = 320, H = 150, L = 36, R = 10, T = 16, B = 24, n = values.length;
  if (!n) return "";
  var lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
  var pad = (hi - lo) * 0.18 || 1;
  var y0 = Math.floor((lo - pad) * 2) / 2, y1 = Math.ceil((hi + pad) * 2) / 2;
  if (y1 === y0) y1 = y0 + 1;
  var px = function (i) { return L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)); };
  var py = function (v) { return T + (H - T - B) * (1 - (v - y0) / (y1 - y0)); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(unit) + ' over time">';
  [y0, (y0 + y1) / 2, y1].forEach(function (t) {
    s += '<line x1="' + L + '" y1="' + py(t).toFixed(1) + '" x2="' + (W - R) + '" y2="' + py(t).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>' +
      '<text x="' + (L - 7) + '" y="' + (py(t) + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--dim)">' + num(t, 1) + "</text>";
  });
  var d = values.map(function (v, i) { return (i ? "L" : "M") + px(i).toFixed(1) + " " + py(v).toFixed(1); }).join(" ");
  s += '<path d="' + d + " L" + px(n - 1).toFixed(1) + " " + (H - B) + " L" + px(0).toFixed(1) + " " + (H - B) + ' Z" fill="' + color + '" fill-opacity="0.13"/>';
  s += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<circle cx="' + px(n - 1).toFixed(1) + '" cy="' + py(values[n - 1]).toFixed(1) + '" r="4.5" fill="' + color + '" stroke="var(--surf)" stroke-width="2"/>';
  s += '<text x="' + (px(n - 1) - 6).toFixed(1) + '" y="' + (py(values[n - 1]) - 9).toFixed(1) + '" text-anchor="end" font-size="10" font-weight="600" fill="var(--txt)">' + num(values[n - 1], 1) + " " + esc(unit) + "</text>";
  var every = Math.max(1, Math.ceil(n / 5));
  labels.forEach(function (lb, i) {
    if (i % every !== 0 && i !== n - 1) return;
    s += '<text x="' + px(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="8.5" fill="var(--dim)">' + esc(lb) + "</text>";
  });
  return s + "</svg>";
}

function niceTop(v) {
  if (v <= 0) return 1;
  var k = Math.pow(10, Math.floor(Math.log10(v))), m = v / k;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * k;
}
function barChart(values, labels, color) {
  var W = 320, H = 132, L = 30, R = 8, T = 14, B = 22, n = values.length;
  if (!n) return "";
  var y1 = niceTop(Math.max.apply(null, values) * 1.1);
  var slot = (W - L - R) / n, bw = Math.min(24, slot - 6);
  var py = function (v) { return T + (H - T - B) * (1 - v / y1); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  [0, y1 / 2, y1].forEach(function (t) {
    s += '<line x1="' + L + '" y1="' + py(t).toFixed(1) + '" x2="' + (W - R) + '" y2="' + py(t).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (py(t) + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--dim)">' + num(t, t % 1 === 0 ? 0 : 1) + "</text>";
  });
  var top = 0;
  values.forEach(function (v, i) {
    if (v > values[top]) top = i;
    var x = L + slot * i + (slot - bw) / 2, y = py(v), h = Math.max(2, (H - B) - y);
    s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="' + color + '"/>';
  });
  if (values[top] > 0) {
    s += '<text x="' + (L + slot * top + slot / 2).toFixed(1) + '" y="' + (py(values[top]) - 5).toFixed(1) + '" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--txt)">' + num(values[top], values[top] % 1 === 0 ? 0 : 1) + "</text>";
  }
  var every = Math.max(1, Math.ceil(n / 5));
  labels.forEach(function (lb, i) {
    if (i % every !== 0) return;
    s += '<text x="' + (L + slot * i + slot / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="8.5" fill="var(--dim)">' + esc(lb) + "</text>";
  });
  return s + "</svg>";
}

/* ============================================================
   Today
   ============================================================ */
function viewToday() {
  var t = selISO(), d = day(t), td = today();
  var setsDone = 0, setsTot = 0;
  d.exercises.forEach(function (e) { setsTot += e.sets; e.done.forEach(function (x) { if (x) setsDone++; }); });
  var takeDone = d.take.filter(function (x) { return x.done; }).length;
  var pct = setsTot ? setsDone / setsTot : 0;
  var h = "";

  /* week strip with what is on each day */
  var wk = weekOf(t);
  h += '<div class="week">' + wk.map(function (dd, i) {
    var sd = state.days[dd], ap = activePlan();
    var pd = ap && ap.days ? ap.days[i] : null;
    var hasW = (sd && sd.exercises.length) || (pd && pd.exercises && pd.exercises.length);
    var hasT = (sd && sd.take.length) || (pd && pd.take && pd.take.length);
    var dots = "";
    if (hasW) dots += '<i style="background:var(--acc)"></i>';
    if (hasT) dots += '<i style="background:var(--s3)"></i>';
    if (!dots) dots += '<i style="background:var(--line)"></i>';
    return '<button type="button" class="wday' + (dd === td ? " today" : dd === t ? " sel" : "") + '" data-day="' + dd + '">' +
      '<span class="dw">' + DW[i] + '</span><span class="dd">' + parseISO(dd).getDate() + '</span><span class="dots">' + dots + "</span></button>";
  }).join("") + "</div>";

  if (t !== td) h += '<button type="button" class="btn ghost sm" data-goto="today">Back to today</button>';

  /* the answer before the detail */
  var w = latestWeight();
  h += '<div class="card"><div class="summary">' +
    ring(pct, 78, "var(--acc)", setsDone + "/" + setsTot, "sets") +
    '<div class="sumlist">' +
      '<div class="sumrow"><span class="stripe" style="background:var(--acc)"></span><span class="lbl">' +
        (d.workoutName ? esc(d.workoutName) : d.exercises.length ? "Workout" : "Rest day") + "</span>" +
        '<span class="val">' + Math.round(pct * 100) + "%</span></div>" +
      '<div class="sumrow"><span class="stripe" style="background:var(--s3)"></span><span class="lbl">Stack</span>' +
        '<span class="val">' + takeDone + "/" + d.take.length + "</span></div>" +
      '<button type="button" class="sumrow" data-sheet="weight"><span class="stripe" style="background:var(--s1)"></span>' +
        '<span class="lbl">Body weight</span><span class="val">' + (w ? num(w.kg, 1) + " kg" : "log") + "</span></button>" +
    "</div></div></div>";

  /* workout */
  h += '<div class="card"><div class="chead"><h2>Workout' + (d.workoutName ? " · " + esc(d.workoutName) : "") + "</h2>" +
    '<span class="note">' + setsDone + " of " + setsTot + " sets</span></div>";
  if (setsTot) {
    h += '<div class="bar"><span class="track"><span class="fill" style="width:' + (pct * 100).toFixed(1) + '%"></span></span>' +
      '<span class="pct">' + Math.round(pct * 100) + "%</span></div>";
  }
  if (d.exercises.length) {
    h += d.exercises.map(function (e, i) {
      var pr = state.prs[keyOf(e.name)];
      var beat = pr && e.kg > pr.kg;
      var sets = "";
      for (var k = 0; k < e.sets; k++) {
        sets += '<button type="button" class="set' + (e.done[k] ? " done" : "") + '" data-set="' + i + ":" + k + '" ' +
          'aria-label="Set ' + (k + 1) + '" aria-pressed="' + !!e.done[k] + '">' + (k + 1) + "</button>";
      }
      var last = lastTime(e.name, t);
      return '<div class="ex"><div class="exhead"><span class="nm">' + esc(e.name) + "</span>" +
        '<span class="tgt">' + e.sets + " × " + e.reps + (e.kg ? " · " + num(e.kg) + " kg" : "") + "</span></div>" +
        '<div class="sets">' + sets + "</div>" +
        '<div class="exmeta"><span class="txt">' +
          (last ? "last " + esc(last) : e.note ? esc(e.note) : "first time") +
          (pr ? ' · best <b>' + num(pr.kg) + " kg</b>" : "") + "</span>" +
        '<button type="button" class="prbtn' + (beat ? " hot" : "") + '" data-pr="' + i + '">' +
        '<svg width="12" height="12" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M9 20h6M12 14v6"/></svg>' +
        (beat ? "New PR" : "PR") + "</button></div></div>";
    }).join("");
  } else {
    h += '<div class="empty">' + (activePlan() ? "Rest day — nothing planned for " + DWL[wdOf(t)] : "No plan yet") + "</div>";
  }
  h += '<div class="btnrow"><button type="button" class="btn ghost sm" data-sheet="addex">+ Exercise</button></div></div>';

  /* stack, grouped by moment */
  h += '<div class="card"><div class="chead"><h2>Stack</h2><span class="note">' + takeDone + " of " + d.take.length + " taken</span></div>";
  if (d.take.length) {
    MOMENTS.forEach(function (mo) {
      var rows = d.take.filter(function (x) { return (x.moment || "Morning") === mo; });
      if (!rows.length) return;
      h += '<div class="moment">' + esc(mo) + "</div>";
      h += rows.map(function (x) {
        var p = item(x.itemId);
        var idx = d.take.indexOf(x);
        var sub = x.done ? "taken " + esc(x.at || "") : x.time ? "planned " + esc(x.time) : "not logged";
        if (p && p.hint) sub += " · " + esc(p.hint);
        if (p && isLow(p)) sub += ' · <span style="color:var(--warn)">' + daysLeft(p) + " days left</span>";
        return '<div class="row">' +
          '<button type="button" class="tick' + (x.done ? " done" : "") + '" data-take="' + idx + '" aria-pressed="' + x.done + '" aria-label="Log">' +
          (x.done ? checkIcon() : "") + "</button>" +
          '<button type="button" class="rbody" data-takeedit="' + idx + '">' +
          '<span class="nm' + (x.done ? " strike" : "") + '">' + esc(p ? p.nm : "?") + " · " + num(x.amount) + " " + esc(x.unit) + "</span>" +
          '<span class="sub">' + sub + "</span></button>" +
          '<span class="chip">' + esc(p ? form(p).label : "") + "</span></div>";
      }).join("");
    });
  } else h += '<div class="empty">Nothing planned today</div>';
  h += "</div>";

  /* coach: announced, not usable */
  h += '<div class="card soon"><div class="chead"><h2>Coach</h2><span class="chip warn">Soon</span></div>' +
    '<div class="hint">An AI that reads your week and proposes things it can set for you — a reminder, a heavier working weight, a heads-up that something is running out. You approve each one.</div>' +
    '<div class="soonlist">' +
      '<div class="row"><div class="rbody"><span class="nm">Bench press · try a heavier top set</span><span class="sub">you hit every set twice in a row</span></div></div>' +
      '<div class="row"><div class="rbody"><span class="nm">Remind you to reorder</span><span class="sub">less than two weeks of servings left</span></div></div>' +
    "</div>" +
    '<div class="chead"><span class="note">examples of what it will say</span><span class="note">not working yet</span></div></div>';

  /* notes and reminders */
  h += '<div class="card"><div class="chead"><h2>Notes &amp; reminders</h2></div>';
  if (d.notes) h += '<div style="font-size:14px;white-space:pre-line;background:var(--raise);border-radius:14px;padding:12px 14px">' + esc(d.notes) + "</div>";
  if (d.reminders.length) {
    h += d.reminders.map(function (r, i) {
      return '<div class="row"><button type="button" class="tick' + (r.done ? " done" : "") + '" data-rem="' + i + '" aria-pressed="' + r.done + '" aria-label="Done">' +
        (r.done ? checkIcon() : "") + "</button>" +
        '<div class="rbody"><span class="nm' + (r.done ? " strike" : "") + '">' + esc(r.text) + "</span>" +
        (r.time ? '<span class="sub">at ' + esc(r.time) + "</span>" : "") + "</div>" +
        '<button type="button" class="xbtn" data-remdel="' + i + '" aria-label="Delete">✕</button></div>';
    }).join("");
  }
  if (!d.notes && !d.reminders.length) h += '<div class="empty">Nothing for this day</div>';
  h += '<div class="btnrow"><button type="button" class="btn ghost sm" data-sheet="note">Note</button>' +
    '<button type="button" class="btn ghost sm" data-sheet="reminder">+ Reminder</button></div></div>';
  return h;
}

function lastTime(name, beforeISO) {
  var k = keyOf(name), best = null;
  Object.keys(state.days).sort().forEach(function (dd) {
    if (dd >= beforeISO) return;
    (state.days[dd].exercises || []).forEach(function (e) {
      if (keyOf(e.name) === k && (e.done || []).some(Boolean)) {
        best = e.sets + " × " + e.reps + (e.kg ? " · " + num(e.kg) + " kg" : "");
      }
    });
  });
  return best;
}
function latestWeight() {
  if (!state.weights.length) return null;
  return state.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; })[state.weights.length - 1];
}

/* ============================================================
   Plan
   ============================================================ */
function viewPlan() {
  if (editPlanId && editWd !== null) return viewDayEditor();
  if (editPlanId) return viewPlanEditor();

  var h = "", ap = activePlan();
  if (ap) {
    h += '<div class="card"><div class="chead"><h2>' + esc(ap.name) + '</h2><span class="chip ok">active</span></div>' +
      '<div class="hint">Repeats every week. Changes apply to days you have not touched yet.</div>';
    for (var wd = 0; wd < 7; wd++) h += planRow(ap, wd, true);
    h += '<div class="btnrow"><button type="button" class="btn ghost sm" data-editplan="' + ap.id + '">Edit plan</button></div></div>';
  } else {
    h += '<div class="card"><h2>No active plan</h2><div class="hint">Build a week once: your workout and what you take per day. After that it repeats itself.</div></div>';
  }

  var others = state.plans.filter(function (p) { return p.id !== state.activePlanId; });
  if (others.length) {
    h += '<div class="card"><div class="chead"><h2>Other plans</h2></div>' + others.map(function (p) {
      return '<div class="row"><div class="rbody"><span class="nm">' + esc(p.name) + '</span>' +
        '<span class="sub">' + esc(p.status || "draft") + "</span></div>" +
        '<button type="button" class="btn line sm" style="flex:0 0 auto" data-editplan="' + p.id + '">Edit</button>' +
        '<button type="button" class="btn sm" style="flex:0 0 auto" data-activate="' + p.id + '">Use</button></div>';
    }).join("") + "</div>";
  }

  h += '<button type="button" class="btn ghost" data-newplan="1">+ New plan</button>';

  /* a prompt for whatever AI you already use — nothing leaves the app */
  h += '<div class="card"><div class="chead"><h2>Write my week with AI</h2><span class="chip ok">free</span></div>' +
    '<div class="hint">Copy the prompt, paste it into any AI you use, paste the answer back. Your stack and training days are already in it.</div>' +
    '<div class="quick" style="justify-content:flex-start">' + ["ChatGPT", "Claude", "Gemini", "Grok", "DeepSeek"].map(function (n) {
      return '<span class="chip">' + n + "</span>";
    }).join("") + "</div>" +
    '<div class="btnrow"><button type="button" class="btn" data-copyprompt="1">Copy prompt</button>' +
    '<button type="button" class="btn line" data-sheet="import">Paste answer</button></div></div>';
  return h;
}

function planRow(pl, wd, nav) {
  var pd = pl.days ? pl.days[wd] : null;
  var take = pd ? (pd.take || []) : [];
  var names = take.map(function (t) { var p = item(t.itemId); return p ? p.nm : ""; }).filter(Boolean).join(", ");
  return '<button type="button" class="prow" data-editday="' + pl.id + ":" + wd + '">' +
    '<span class="dw">' + DW[wd] + '</span><span class="b">' +
    '<span class="t1' + (pd && pd.workoutName ? "" : " restday") + '">' + (pd && pd.workoutName ? esc(pd.workoutName) : "Rest day") + "</span>" +
    '<span class="t2">' + (pd && pd.exercises.length ? pd.exercises.length + " exercises" : "") +
      (pd && pd.exercises.length && names ? " · " : "") + esc(names) + "</span></span>" + chevron() + "</button>";
}

function viewPlanEditor() {
  var pl = plan(editPlanId);
  if (!pl) { editPlanId = null; return viewPlan(); }
  var isActive = pl.id === state.activePlanId;
  var h = '<div class="card"><div class="chead"><h2>' + esc(pl.name) + '</h2>' +
    '<span class="chip ' + (isActive ? "ok" : "") + '">' + (isActive ? "active" : "draft") + "</span></div>" +
    '<div class="btnrow"><button type="button" class="btn ghost sm" data-sheet="planname">Rename</button></div>';
  for (var wd = 0; wd < 7; wd++) h += planRow(pl, wd, true);
  h += "</div>";
  h += '<div class="btnrow">' +
    (isActive ? "" : '<button type="button" class="btn" data-activate="' + pl.id + '">Use this plan</button>') +
    '<button type="button" class="btn line" data-back="1">Done</button>' +
    '<button type="button" class="btn danger fixed" data-delplan="' + pl.id + '">Delete</button></div>';
  return h;
}

function viewDayEditor() {
  var pl = plan(editPlanId);
  if (!pl) { editPlanId = null; editWd = null; return viewPlan(); }
  var pd = planDay(pl, editWd);
  var h = '<div class="card"><div class="chead"><h2>Workout' + (pd.workoutName ? " · " + esc(pd.workoutName) : "") + "</h2>" +
    '<button type="button" class="btn ghost sm" style="flex:0 0 auto" data-sheet="pdname">Name</button></div>';
  if (pd.exercises.length) {
    h += pd.exercises.map(function (e, i) {
      return '<button type="button" class="prow" data-pdex="' + i + '"><span class="b">' +
        '<span class="t1">' + esc(e.name) + "</span>" +
        '<span class="t2">' + e.sets + " × " + e.reps + (e.kg ? " · " + num(e.kg) + " kg" : "") + "</span></span>" + chevron() + "</button>";
    }).join("");
  } else h += '<div class="empty">Rest day — or add exercises</div>';
  h += '<div class="btnrow"><button type="button" class="btn ghost sm" data-pdex="new">+ Exercise</button></div></div>';

  h += '<div class="card"><div class="chead"><h2>Stack on ' + DWL[editWd] + "</h2></div>";
  if (pd.take.length) {
    h += pd.take.map(function (t, i) {
      var p = item(t.itemId);
      return '<div class="row"><div class="rbody"><span class="nm">' + esc(p ? p.nm : "?") + " · " + (p ? amountLabel(p) : "") + "</span>" +
        '<span class="sub">' + esc(t.moment || "Morning") + (t.time ? " · " + esc(t.time) : "") + "</span></div>" +
        '<button type="button" class="xbtn" data-pdtakedel="' + i + '" aria-label="Remove">✕</button></div>';
    }).join("");
  } else h += '<div class="empty">Nothing on this day</div>';
  h += '<div class="btnrow"><button type="button" class="btn ghost sm" data-sheet="pdtake">+ Add from stack</button></div></div>';

  h += '<div class="card"><div class="chead"><h2>Notes &amp; reminders</h2></div>';
  if (pd.notes) h += '<div style="font-size:14px;white-space:pre-line;background:var(--raise);border-radius:14px;padding:12px 14px">' + esc(pd.notes) + "</div>";
  if (pd.reminders.length) {
    h += pd.reminders.map(function (r, i) {
      return '<div class="row"><div class="rbody"><span class="nm">' + esc(r.text) + "</span>" +
        (r.time ? '<span class="sub">at ' + esc(r.time) + "</span>" : "") + "</div>" +
        '<button type="button" class="xbtn" data-pdremdel="' + i + '" aria-label="Remove">✕</button></div>';
    }).join("");
  }
  if (!pd.notes && !pd.reminders.length) h += '<div class="empty">Repeats every ' + DWL[editWd] + "</div>";
  h += '<div class="btnrow"><button type="button" class="btn ghost sm" data-sheet="pdnote">Note</button>' +
    '<button type="button" class="btn ghost sm" data-sheet="pdreminder">+ Reminder</button></div></div>';

  h += '<button type="button" class="btn line" data-back="1">Back to the week</button>';
  return h;
}

/* ============================================================
   Stats
   ============================================================ */
var RANGE = "12w";
function rangeWeeks() { return RANGE === "12w" ? 12 : RANGE === "1y" ? 52 : 520; }

function weekStarts(n) {
  var out = [], mon = addDays(today(), -wdOf(today()));
  for (var i = n - 1; i >= 0; i--) out.push(addDays(mon, -7 * i));
  return out;
}
function volumeOf(dISO) {
  var d = state.days[dISO];
  if (!d) return 0;
  var v = 0;
  (d.exercises || []).forEach(function (e) {
    var done = (e.done || []).filter(Boolean).length;
    v += done * (e.reps || 0) * (e.kg || 0);
  });
  return v;
}

function viewStats() {
  var h = "";
  var weeks = weekStarts(Math.min(rangeWeeks(), 52));
  var wLabels = weeks.map(shortDate);

  var vol = weeks.map(function (ws) {
    var v = 0;
    for (var i = 0; i < 7; i++) v += volumeOf(addDays(ws, i));
    return Math.round(v / 100) / 10;                    /* tonnes */
  });
  var sessions = weeks.map(function (ws) {
    var n = 0;
    for (var i = 0; i < 7; i++) {
      var d = state.days[addDays(ws, i)];
      if (d && (d.exercises || []).some(function (e) { return (e.done || []).some(Boolean); })) n++;
    }
    return n;
  });

  var totVol = vol.reduce(function (a, b) { return a + b; }, 0);
  var w = latestWeight();
  var firstW = state.weights.length ? state.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0] : null;
  var dw = w && firstW ? round(w.kg - firstW.kg) : 0;

  h += '<div class="statgrid">' +
    '<div class="stat"><span class="v">' + (w ? num(w.kg, 1) : "—") + '<s> kg</s></span><span class="k">weight</span></div>' +
    '<div class="stat"><span class="v">' + (dw ? (dw > 0 ? "+" : "") + num(dw, 1) : "—") + '<s> kg</s></span><span class="k">change</span></div>' +
    '<div class="stat"><span class="v">' + num(Math.round(totVol * 10) / 10, 1) + '<s> t</s></span><span class="k">lifted</span></div>' +
    "</div>";

  h += '<div class="card"><div class="chead"><h2>Body weight</h2><span class="note">' +
    (RANGE === "12w" ? "12 weeks" : RANGE === "1y" ? "1 year" : "everything") + "</span></div>" +
    '<div class="seg">' + [["12w", "12 weeks"], ["1y", "1 year"], ["all", "All"]].map(function (r) {
      return '<button type="button" data-range="' + r[0] + '" aria-pressed="' + (RANGE === r[0]) + '">' + r[1] + "</button>";
    }).join("") + "</div>";
  var wSeries = weightSeries();
  h += wSeries.values.length > 1
    ? '<div class="chart">' + lineChart(wSeries.values, wSeries.labels, "var(--s1)", "kg") + "</div>"
    : '<div class="empty">Log your weight a few times and the line appears here</div>';
  h += '<div class="btnrow"><button type="button" class="btn ghost sm" data-sheet="weight">Log weight</button></div></div>';

  h += '<div class="card"><div class="chead"><h2>Volume lifted</h2><span class="note">tonnes per week</span></div>' +
    (totVol > 0 ? '<div class="chart">' + barChart(vol, wLabels, "var(--s2)") + "</div>" : '<div class="empty">Tick off some sets first</div>') + "</div>";

  h += '<div class="card"><div class="chead"><h2>Sessions per week</h2><span class="note">' + weeks.length + " weeks</span></div>" +
    '<div class="chart">' + barChart(sessions, wLabels, "var(--acc)") + "</div></div>";

  /* records */
  var prKeys = Object.keys(state.prs);
  h += '<div class="card"><div class="chead"><h2>Personal records</h2><span class="note">' + prKeys.length + "</span></div>";
  if (prKeys.length) {
    h += prKeys.sort().map(function (k) {
      var r = state.prs[k];
      return '<div class="kv"><span class="k">' + esc(r.name || k) + '</span><span class="v">' + num(r.kg) + " kg × " + r.reps + " · " + shortDate(r.date) + "</span></div>";
    }).join("");
  } else h += '<div class="empty">Hit the PR button on an exercise</div>';
  h += "</div>";

  /* what you took, per item */
  state.stack.forEach(function (p) {
    var data = weeks.map(function (ws) {
      var v = 0;
      state.history.forEach(function (x) {
        if (x.name === p.nm && x.date >= ws && x.date < addDays(ws, 7)) v += x.amount;
      });
      return round(v);
    });
    if (!data.some(function (v) { return v > 0; })) return;
    h += '<div class="card"><div class="chead"><h2>' + esc(p.nm) + '</h2><span class="note">' + esc(p.dose.u) + " per week</span></div>" +
      '<div class="chart">' + barChart(data, wLabels, "var(--s3)") + "</div></div>";
  });

  /* the log itself */
  h += '<div class="card"><div class="chead"><h2>Log</h2><span class="note">' + state.history.length + "</span></div>";
  if (state.history.length) {
    h += state.history.slice(0, 40).map(function (x) {
      return '<div class="kv"><span class="k">' + esc(x.name) + " · " + num(x.amount) + " " + esc(x.unit) + "</span>" +
        '<span class="v">' + shortDate(x.date) + " " + esc(x.at || "") + "</span></div>";
    }).join("");
  } else h += '<div class="empty">Nothing logged yet</div>';
  h += "</div>";
  return h;
}

function weightSeries() {
  var sorted = state.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var cut = RANGE === "all" ? "0000-00-00" : addDays(today(), -7 * rangeWeeks());
  var kept = sorted.filter(function (x) { return x.date >= cut; });
  return { values: kept.map(function (x) { return x.kg; }), labels: kept.map(function (x) { return shortDate(x.date); }) };
}

/* ============================================================
   Supply
   ============================================================ */
function viewSupply() {
  var h = "";
  if (!state.stack.length) {
    h += '<div class="card"><div class="empty">Nothing in your stack yet.<br>Add whatever you take — protein, creatine, pills, a vial.</div></div>';
  }
  h += state.stack.map(function (p) {
    var left = servings(p), days = daysLeft(p), low = isLow(p);
    var frac = p.cont.n > 0 ? Math.max(0, Math.min(1, p.left / p.cont.n)) : 0;
    var col = low ? "var(--warn)" : "var(--acc)";
    var ns = nextStep(p, today());
    var s = '<div class="card"' + (low ? ' style="border-color:var(--warn)"' : "") + ">" +
      '<div class="chead"><h2>' + esc(p.nm) + "</h2>" +
      '<span style="display:flex;gap:6px;align-items:center;flex-shrink:0">' +
      '<span class="chip">' + form(p).label + "</span>" +
      '<span class="chip' + (low ? " warn" : "") + '">' + days + " days</span></span></div>" +
      '<div class="vial">' + ring(frac, 70, col, num(p.left, p.left % 1 === 0 ? 0 : 1), p.cont.u) +
      '<div class="vialstats">' +
        '<div class="kv"><span class="k">' + form(p).container.charAt(0).toUpperCase() + form(p).container.slice(1) + '</span><span class="v">' + num(p.cont.n) + " " + esc(p.cont.u) + "</span></div>" +
        '<div class="kv"><span class="k">Left</span><span class="v">' + left + " × " + amountLabel(p) + "</span></div>" +
        '<div class="kv"><span class="k">Each time</span><span class="v">' + amountLabel(p) + "</span></div>" +
        '<div class="kv"><span class="k">Per week</span><span class="v">' + (p.perWeek || 7) + "×</span></div>" +
      "</div></div>";
    if (p.hint) s += tickRule() + '<div class="chead"><span class="note">' + esc(p.hint) + "</span></div>";
    if ((p.steps || []).length) {
      var sorted = p.steps.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; });
      var steps = (sorted.length && round(sorted[0].n) === round(p.dose.n))
        ? sorted
        : [{ id: "start", from: null, n: p.dose.n }].concat(sorted);
      var act = 0;
      steps.forEach(function (st, i) { if (!st.from || st.from <= today()) act = i; });
      s += '<div class="steps">' + steps.map(function (st, i) {
        var cls = i < act ? "past" : i === act ? "now" : "next";
        return '<div class="step ' + cls + '"><span class="rail"><span class="dot"></span>' +
          (i < steps.length - 1 ? '<span class="line"></span>' : "") + "</span>" +
          '<span class="txt"><span class="d1">' + num(st.n) + " " + esc(p.dose.u) + " each time" + (cls === "now" ? " · now" : "") + "</span>" +
          '<span class="d2">' + (st.from ? "from " + shortDate(st.from) : "start") + "</span></span></div>";
      }).join("") + "</div>";
    }
    if (ns) s += '<div class="hint">Changes to <b>' + num(ns.n) + " " + esc(p.dose.u) + "</b> on " + shortDate(ns.from) + ".</div>";
    if (low) s += '<div class="hint" style="color:var(--warn)">Running out in ' + days + " days — order a new " + form(p).container + ".</div>";
    s += '<div class="btnrow"><button type="button" class="btn sm" data-log="' + p.id + '">Log</button>' +
      '<button type="button" class="btn line sm" data-refill="' + p.id + '">New ' + form(p).container + "</button>" +
      '<button type="button" class="btn ghost sm fixed" data-edititem="' + p.id + '">Edit</button></div></div>';
    return s;
  }).join("");
  h += '<button type="button" class="btn ghost" data-sheet="additem">+ Add to stack</button>';
  return h;
}

/* ============================================================
   sheets
   ============================================================ */
function stepFor(unit, value) {
  if (unit === "caps") return 1;
  if (unit === "g") return 1;
  if (unit === "ml") return 0.5;
  return value <= 1 ? 0.05 : 0.25;
}

function sheetShell(title, body) {
  return '<div class="sheet" data-close="1"><div class="sheetcard">' +
    '<span class="grab"></span><h2>' + title + "</h2>" + body + "</div></div>";
}
function stepperHtml(value, unit, dec) {
  return '<div class="stepper"><button type="button" data-step="-1" aria-label="Less">−</button>' +
    '<span class="val"><input class="n" id="amtInput" type="text" inputmode="decimal" aria-label="Amount" value="' + num(value, dec) + '">' +
    '<span class="u">' + esc(unit) + "</span></span>" +
    '<button type="button" data-step="1" aria-label="More">+</button></div>';
}
function quickHtml(values, current, unit) {
  return '<div class="quick">' + values.map(function (v) {
    return '<button type="button" data-amt="' + v + '" aria-pressed="' + (round(current) === round(v)) + '">' + num(v) + " " + esc(unit) + "</button>";
  }).join("") + "</div>";
}
function sheetButtons(saveLabel, saveId) {
  return '<div class="btnrow"><button type="button" class="btn line" data-close="1">Cancel</button>' +
    '<button type="button" class="btn" data-save="' + saveId + '">' + saveLabel + "</button></div>";
}

function viewSheet() {
  if (!sheet) return "";
  var k = sheet.kind;

  if (k === "log") {
    var p = item(sheet.itemId);
    if (!p) return "";
    var planned = doseOn(p, selISO());
    return sheetShell("Log " + esc(p.nm),
      stepperHtml(sheet.amount, p.dose.u, sheet.amount % 1 === 0 ? 0 : 2) +
      quickHtml([planned, round(planned / 2), round(planned * 2)], sheet.amount, p.dose.u) +
      '<label class="f">Time<input id="logTime" type="time" value="' + esc(sheet.at) + '"></label>' +
      '<div class="hint" id="logHint" style="text-align:center">' + logHint(p, sheet.amount) + "</div>" +
      sheetButtons("Log", "log"));
  }

  if (k === "pr") {
    var d = day(selISO()), e = d.exercises[sheet.ex];
    if (!e) return "";
    var cur = state.prs[keyOf(e.name)];
    return sheetShell("Record · " + esc(e.name),
      stepperHtml(sheet.amount, "kg", sheet.amount % 1 === 0 ? 0 : 1) +
      quickHtml([e.kg || 20, round((e.kg || 20) + 2.5), round((e.kg || 20) + 5)], sheet.amount, "kg") +
      '<label class="f">Reps<input id="prReps" type="text" inputmode="numeric" value="' + sheet.reps + '"></label>' +
      '<div class="hint" id="prHint" style="text-align:center">' + prHint(cur, sheet.amount) + "</div>" +
      sheetButtons("Save record", "pr"));
  }

  if (k === "weight") {
    var lw = latestWeight();
    return sheetShell("Body weight",
      stepperHtml(sheet.amount, "kg", 1) +
      '<label class="f">Date<input id="wDate" type="date" value="' + esc(sheet.date) + '"></label>' +
      '<div class="hint" style="text-align:center">' + (lw ? "Last: <b>" + num(lw.kg, 1) + " kg</b> on " + shortDate(lw.date) : "First entry.") + "</div>" +
      sheetButtons("Save", "weight"));
  }

  if (k === "additem" || k === "edititem") {
    var it = k === "edititem" ? item(sheet.itemId) : null;
    var f = it || { nm: "", kind: "powder", cont: { n: "", u: "g" }, dose: { n: "", u: "g" }, left: "", perWeek: 7, moment: "Morning", hint: "" };
    return sheetShell(it ? "Edit " + esc(it.nm) : "Add to stack",
      '<div class="fields">' +
      '<label class="f">Name<input id="iNm" value="' + esc(f.nm) + '" placeholder="Creatine"></label>' +
      '<label class="f">Form<select id="iKind">' + Object.keys(FORM).map(function (kk) {
        return '<option value="' + kk + '"' + (f.kind === kk ? " selected" : "") + ">" + FORM[kk].label + " · " + FORM[kk].container + "</option>";
      }).join("") + "</select></label>" +
      '<div class="g3">' +
      '<label class="f">Container<input id="iCont" type="text" inputmode="decimal" value="' + esc(f.cont.n) + '"></label>' +
      '<label class="f">Each time<input id="iDose" type="text" inputmode="decimal" value="' + esc(f.dose.n) + '"></label>' +
      '<label class="f">Per week<input id="iWeek" type="text" inputmode="numeric" value="' + esc(f.perWeek || 7) + '"></label>' +
      "</div>" +
      (it ? '<label class="f">Left in ' + form(it).container + '<input id="iLeft" type="text" inputmode="decimal" value="' + esc(f.left) + '"></label>' : "") +
      '<label class="f">Default moment<select id="iMoment">' + MOMENTS.map(function (m) {
        return '<option' + (f.moment === m ? " selected" : "") + ">" + m + "</option>";
      }).join("") + "</select></label>" +
      '<label class="f">Note (optional)<input id="iHint" value="' + esc(f.hint || "") + '" placeholder="2 scoops"></label>' +
      "</div>" +
      (it ? '<div class="btnrow"><button type="button" class="btn danger" data-delitem="' + it.id + '">Delete</button>' +
            '<button type="button" class="btn" data-save="item">Save</button></div>'
          : sheetButtons("Add", "item")));
  }

  if (k === "steps") {
    var sp = item(sheet.itemId);
    if (!sp) return "";
    var rows = (sp.steps || []).slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; });
    return sheetShell("Schedule · " + esc(sp.nm),
      '<div class="hint">Now: <b>' + amountLabel(sp) + "</b> each time. Add a line for every change.</div>" +
      (rows.length ? rows.map(function (st) {
        return '<div class="row"><div class="rbody"><span class="nm">' + num(st.n) + " " + esc(sp.dose.u) + "</span>" +
          '<span class="sub">from ' + shortDate(st.from) + "</span></div>" +
          '<button type="button" class="xbtn" data-delstep="' + st.id + '" aria-label="Remove">✕</button></div>';
      }).join("") : '<div class="empty">No changes planned</div>') +
      '<div class="g2"><label class="f">From<input id="stFrom" type="date" value="' + today() + '"></label>' +
      '<label class="f">Amount<input id="stN" type="text" inputmode="decimal" placeholder="' + num(sp.dose.n) + '"></label></div>' +
      '<div class="btnrow"><button type="button" class="btn line" data-close="1">Close</button>' +
      '<button type="button" class="btn" data-save="step">Add</button></div>');
  }

  if (k === "addex" || k === "pdex") {
    var ex = sheet.ex != null && sheet.ex !== "new"
      ? (k === "pdex" ? planDay(plan(editPlanId), editWd).exercises[sheet.ex] : day(selISO()).exercises[sheet.ex])
      : null;
    var ef = ex || { name: "", sets: 3, reps: 10, kg: "" };
    return sheetShell(ex ? "Edit exercise" : "Add exercise",
      '<div class="fields">' +
      '<label class="f">Exercise<input id="eNm" value="' + esc(ef.name) + '" placeholder="Bench press"></label>' +
      '<div class="g3">' +
      '<label class="f">Sets<input id="eSets" type="text" inputmode="numeric" value="' + esc(ef.sets) + '"></label>' +
      '<label class="f">Reps<input id="eReps" type="text" inputmode="numeric" value="' + esc(ef.reps) + '"></label>' +
      '<label class="f">Kg<input id="eKg" type="text" inputmode="decimal" value="' + esc(ef.kg) + '"></label>' +
      "</div></div>" +
      (ex ? '<div class="btnrow"><button type="button" class="btn danger" data-delex="' + sheet.ex + '">Delete</button>' +
            '<button type="button" class="btn" data-save="ex">Save</button></div>'
          : sheetButtons("Add", "ex")));
  }

  if (k === "pdtake") {
    if (!state.stack.length) return sheetShell("Nothing in your stack", '<div class="hint">Add something under Supply first.</div>' +
      '<div class="btnrow"><button type="button" class="btn" data-close="1">OK</button></div>');
    return sheetShell("Add from stack",
      '<div class="fields">' +
      '<label class="f">Item<select id="tItem">' + state.stack.map(function (p) {
        return '<option value="' + p.id + '">' + esc(p.nm) + " · " + amountLabel(p) + "</option>";
      }).join("") + "</select></label>" +
      '<label class="f">Moment<select id="tMoment">' + MOMENTS.map(function (m) { return "<option>" + m + "</option>"; }).join("") + "</select></label>" +
      '<label class="f">Time (optional — sends a notification)<input id="tTime" type="time"></label>' +
      "</div>" + sheetButtons("Add", "pdtake"));
  }

  if (k === "note" || k === "pdnote") {
    var cur2 = k === "note" ? day(selISO()).notes : planDay(plan(editPlanId), editWd).notes;
    return sheetShell("Note",
      '<label class="f"><textarea id="nText" rows="5" placeholder="Anything worth remembering">' + esc(cur2 || "") + "</textarea></label>" +
      sheetButtons("Save", k));
  }

  if (k === "reminder" || k === "pdreminder") {
    return sheetShell("Reminder",
      '<div class="fields"><label class="f">Reminder<input id="rText" placeholder="Eat 1 hour before gym"></label>' +
      '<label class="f">Time (optional — sends a notification)<input id="rTime" type="time"></label></div>' +
      sheetButtons("Add", k));
  }

  if (k === "planname" || k === "pdname") {
    var val = k === "planname" ? (plan(editPlanId) || {}).name : planDay(plan(editPlanId), editWd).workoutName;
    return sheetShell(k === "planname" ? "Plan name" : "Workout name",
      '<label class="f"><input id="pName" value="' + esc(val || "") + '" placeholder="' + (k === "planname" ? "Cut &amp; strength" : "Push") + '"></label>' +
      sheetButtons("Save", k));
  }

  if (k === "import") {
    return sheetShell("Paste the AI answer",
      '<label class="f"><textarea id="impText" rows="7" placeholder="Paste the JSON block here"></textarea></label>' +
      '<div class="hint" id="impHint">It replies with one JSON block. Paste it whole — the fences are fine.</div>' +
      sheetButtons("Import", "import"));
  }

  if (k === "settings") {
    return sheetShell("Settings",
      '<div class="kv"><span class="k">Items</span><span class="v">' + state.stack.length + "</span></div>" +
      '<div class="kv"><span class="k">Days with data</span><span class="v">' + Object.keys(state.days).length + "</span></div>" +
      '<div class="kv"><span class="k">Log entries</span><span class="v">' + state.history.length + "</span></div>" +
      '<div class="kv"><span class="k">Storage</span><span class="v">' + (db ? "cloud + phone" : "this phone") + "</span></div>" +
      tickRule() +
      '<div class="kv"><span class="k">Notifications</span><span class="v">' + notifStatus() + "</span></div>" +
      '<div class="btnrow">' +
        (state.notifyOn ? '<button type="button" class="btn ghost sm" data-notif="off">Turn off</button>'
                        : '<button type="button" class="btn ghost sm" data-notif="on">Turn on</button>') +
        '<button type="button" class="btn ghost sm" data-theme="1">' + (state.theme === "light" ? "Dark" : "Light") + " mode</button></div>" +
      tickRule() +
      '<div class="btnrow"><button type="button" class="btn ghost sm" data-sheet="export">Export</button>' +
      '<button type="button" class="btn ghost sm" data-sheet="restore">Restore</button></div>' +
      '<div class="btnrow"><button type="button" class="btn danger sm" data-wipe="1">Erase everything</button></div>' +
      '<div class="btnrow"><button type="button" class="btn line" data-close="1">Close</button></div>');
  }

  if (k === "export") {
    return sheetShell("Export",
      '<div class="hint">Copy this and keep it somewhere safe. Restore pastes it back.</div>' +
      '<label class="f"><textarea id="expText" rows="7" readonly>' + esc(JSON.stringify(state)) + "</textarea></label>" +
      '<div class="btnrow"><button type="button" class="btn" data-copyexport="1">Copy</button>' +
      '<button type="button" class="btn line" data-close="1">Close</button></div>');
  }

  if (k === "restore") {
    return sheetShell("Restore",
      '<label class="f"><textarea id="resText" rows="7" placeholder="Paste your backup"></textarea></label>' +
      '<div class="hint" id="resHint">This replaces everything you have now.</div>' +
      sheetButtons("Restore", "restore"));
  }

  if (k === "confirm") {
    return sheetShell(esc(sheet.title),
      '<div class="hint">' + esc(sheet.body) + "</div>" +
      '<div class="btnrow"><button type="button" class="btn line" data-close="1">Cancel</button>' +
      '<button type="button" class="btn danger" data-confirm="1">Yes, do it</button></div>');
  }
  return "";
}

function logHint(p, v) {
  var planned = doseOn(p, selISO());
  return round(v) !== round(planned)
    ? "Just this once. Your plan stays at <b>" + num(planned) + " " + esc(p.dose.u) + "</b>."
    : "Taken from your plan. Change it above if today is different.";
}
/* lower is allowed on purpose: a record typed wrong has to be fixable */
function prHint(cur, v) {
  if (!cur) return "First record for this lift.";
  if (v > cur.kg) return "Beats <b>" + num(cur.kg) + " kg</b> from " + shortDate(cur.date) + ".";
  if (round(v) === round(cur.kg)) return "Same as your record from " + shortDate(cur.date) + ".";
  return "Lower than <b>" + num(cur.kg) + " kg</b>. Saving replaces it — use this to fix a typo.";
}

function openSheet(o) { sheet = o; render(); }
function closeSheet() { sheet = null; render(); }

/* stepping patches the sheet instead of re-rendering, so the caret survives typing */
function syncSheet() {
  var inp = document.getElementById("amtInput");
  if (inp && document.activeElement !== inp) {
    inp.value = num(sheet.amount, sheet.kind === "log" ? (sheet.amount % 1 === 0 ? 0 : 2) : (sheet.amount % 1 === 0 ? 0 : 1));
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-amt]"), function (b) {
    b.setAttribute("aria-pressed", String(round(sheet.amount) === round(parseFloat(b.dataset.amt))));
  });
  var lh = document.getElementById("logHint");
  if (lh && sheet.kind === "log") lh.innerHTML = logHint(item(sheet.itemId), sheet.amount);
  var ph = document.getElementById("prHint");
  if (ph && sheet.kind === "pr") {
    var e = day(selISO()).exercises[sheet.ex];
    ph.innerHTML = prHint(state.prs[keyOf(e.name)], sheet.amount);
  }
}

/* ============================================================
   actions
   ============================================================ */
function logTake(idx, amount, at) {
  var d = day(selISO()), x = d.take[idx];
  if (!x || x.done) return;
  var p = item(x.itemId);
  x.amount = amount != null ? round(amount) : x.amount;
  x.done = true;
  x.at = at || nowHM();
  x.histId = uid();
  if (p) p.left = Math.max(0, round(p.left - x.amount));
  state.history.unshift({ id: x.histId, date: selISO(), at: x.at, name: p ? p.nm : "?", amount: x.amount, unit: x.unit });
  d.userEdited = true;
  save();
}
function unlogTake(idx) {
  var d = day(selISO()), x = d.take[idx];
  if (!x || !x.done) return;
  var p = item(x.itemId);
  if (p) p.left = round(p.left + x.amount);
  /* the log entry is found by its own id, never by matching values */
  if (x.histId) {
    for (var i = 0; i < state.history.length; i++) {
      if (state.history[i].id === x.histId) { state.history.splice(i, 1); break; }
    }
  }
  x.done = false; x.at = ""; x.histId = null;
  d.userEdited = true;
  save();
}

function aiPrompt() {
  var lines = state.stack.map(function (p) {
    return "- " + p.nm + " · " + amountLabel(p) + " · " + (p.perWeek || 7) + "x per week · form " + form(p).label;
  }).join("\n") || "- (nothing yet, you may suggest some)";
  return "Write a weekly gym plan for my planner app.\n\n" +
    "Reply with ONLY one JSON code block, exactly this shape:\n\n" +
    "{\n" +
    '  "name": "Plan name",\n' +
    '  "days": {\n' +
    '    "0": {\n' +
    '      "workout": "Push",\n' +
    '      "exercises": [ { "name": "Bench press", "sets": 4, "reps": 8, "kg": 80 } ],\n' +
    '      "take": [ { "name": "Creatine", "moment": "Morning", "time": "09:00" } ],\n' +
    '      "note": "",\n' +
    '      "reminders": [ { "text": "Eat 1 hour before gym", "time": "17:00" } ]\n' +
    "    }\n" +
    "  }\n" +
    "}\n\n" +
    "Rules:\n" +
    '- day keys are "0" to "6", 0 = Monday. Leave rest days out.\n' +
    '- "moment" is one of: ' + MOMENTS.join(", ") + ".\n" +
    '- do not put an amount on "take" — the amount comes from my stack below.\n' +
    "- give every exercise a real starting weight in kg.\n\n" +
    "My stack:\n" + lines + "\n\n" +
    "Me: [your age, weight, how many days you can train, what equipment you have, your goal]";
}

function importPlan(raw) {
  var text = String(raw || "").trim();
  var m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m) text = m[1].trim();
  var data;
  try { data = JSON.parse(text); } catch (e) { return "That is not valid JSON. Paste the whole code block."; }
  if (!data || typeof data !== "object" || !data.days) return 'The answer has no "days" in it.';

  var pl = { id: uid(), name: String(data.name || "AI plan"), status: "draft", days: {} };
  for (var wd = 0; wd < 7; wd++) {
    var src = data.days[String(wd)] || data.days[wd];
    if (!src) continue;
