name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle web app
        working-directory: ios
        run: |
          mkdir -p Resources
          cp ../app/index.html Resources/index.html

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project GymPlanner.xcodeproj \
            -scheme GymPlanner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GymPlanner.app Payload/
          cp ../app/index.html Payload/GymPlanner.app/index.html
          test -f Payload/GymPlanner.app/index.html
          codesign --force --deep --sign - Payload/GymPlanner.app
          codesign --verify Payload/GymPlanner.app
          zip -r GymPlanner.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymPlanner-ipa
          path: ios/GymPlanner.ipa

      - name: Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ios/GymPlanner.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
