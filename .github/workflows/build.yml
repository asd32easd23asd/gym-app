name: Build unsigned IPA

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for offline app checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate app and run data-model tests
        run: |
          npm run check
          npm test
          swift scripts/validate-bundle.swift --self-test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle every offline web resource
        run: |
          mkdir -p ios/WebApp
          cp -R app/. ios/WebApp/
          test -s ios/WebApp/index.html

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project GymPlanner.xcodeproj \
            -scheme GymPlanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA for user-controlled signing
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GymPlanner.app Payload/
          swift ../scripts/validate-bundle.swift Payload/GymPlanner.app
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/GymPlanner.app/Info.plist
          zip -q -r GymPlanner-2.0.1.ipa Payload
          shasum -a 256 GymPlanner-2.0.1.ipa > GymPlanner-2.0.1.ipa.sha256

      - name: Install and launch on an iPhone simulator
        run: bash scripts/ios-smoke.sh

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-smoke-${{ github.run_number }}
          path: |
            artifacts/iPhone-smoke.png
            artifacts/invalid-layout.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymPlanner-ipa-${{ github.run_number }}
          path: |
            ios/GymPlanner-2.0.1.ipa
            ios/GymPlanner-2.0.1.ipa.sha256
          if-no-files-found: error
          retention-days: 14
